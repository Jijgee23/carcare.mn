<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidebar nav</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <!-- swap for your compiled ./dist/output.css in production -->
  <!-- IMPORTANT: darkMode:'class' must be applied or every dark:* utility falls back to
     prefers-color-scheme and hijacks your light theme. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {
      darkMode: 'class', theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: {
            brand: { 50: '#F2EEFF', 100: '#E3DBFF', 200: '#C7B4FF', 300: '#A98CFB', 400: '#8B67F0', 500: '#6C4FD8', 600: '#5B2BE0', 700: '#4F23D9', 800: '#3F1CAD', 900: '#2E1480' },
            ink: { 700: '#252A45', 800: '#1A1D36', 900: '#12142B', 950: '#0E1024' }
          },
          width: { rail: '4.5rem', sidebar: '16rem' }
        }
      }
    };</script>
</head>

<body class="h-full bg-slate-50 font-sans antialiased dark:bg-ink-900">

  <div class="flex h-full">

    <!-- ============ SCRIM (mobile only) ============ -->
    <div id="scrim" class="fixed inset-0 z-30 hidden bg-ink-950/50 backdrop-blur-sm lg:hidden"></div>

    <!-- ============ SIDEBAR ============ -->
    <!--
    Responsive contract:
      < 640px   fixed off-canvas drawer, slides in on the hamburger  (-translate-x-full)
      640-1024  72px icon rail, labels hidden, tooltips on hover
      >= 1024px 256px full sidebar
    data-collapsed="true" on <aside> forces the rail at any width.
  -->
    <aside id="sidebar" class="group/side fixed inset-y-0 left-0 z-40 flex w-sidebar -translate-x-full flex-col
           border-r border-slate-200/80 bg-white px-4 py-4 transition-transform duration-300 ease-out
           sm:relative sm:w-rail sm:translate-x-0 sm:px-2
           lg:w-sidebar lg:px-4
           dark:border-white/5 dark:bg-ink-950
           data-[open=true]:translate-x-0
           data-[collapsed=true]:sm:w-rail data-[collapsed=true]:lg:w-rail data-[collapsed=true]:lg:px-2">

      <!-- collapse toggle (desktop) -->
      <button type="button" data-collapse-toggle class="absolute -right-3 top-5 z-10 hidden h-6 w-6 place-items-center rounded-full border border-slate-200
             bg-white text-slate-500 shadow-sm transition-colors hover:text-brand-600 sm:grid
             dark:border-white/10 dark:bg-ink-800 dark:text-slate-300" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" class="h-4 w-4">
          <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>

      <!-- brand -->
      <div class="mb-5 flex h-9 items-center gap-2.5 sm:justify-center lg:justify-start
                group-data-[collapsed=true]/side:lg:justify-center">
        <div class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-brand-600 text-white">
          <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5">
            <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="2" />
            <circle cx="12" cy="12" r="2.5" fill="currentColor" />
          </svg>
        </div>
        <span class="truncate text-[16px] font-bold tracking-tight text-slate-900 sm:hidden lg:inline
                   group-data-[collapsed=true]/side:lg:hidden dark:text-white">ABC Solutions</span>
      </div>

      <!-- scrollable nav region: min-h-0 is REQUIRED or the flex item refuses to shrink
         and the promo + user row spill out of a fixed-height sidebar -->
      <!-- overflow-visible on the rail so the hover tooltips aren't clipped -->
      <div class="min-h-0 flex-1 overflow-y-auto sm:overflow-visible lg:overflow-y-auto
                group-data-[collapsed=true]/side:lg:overflow-visible">
        <!-- primary nav -->
        <nav class="flex flex-col gap-1">
          <!-- ACTIVE row -->
          <a href="#" aria-current="page" class="group relative flex h-11 items-center gap-3 rounded-xl bg-brand-600 px-3 text-[13px] font-medium text-white
               transition-colors hover:bg-brand-700 sm:justify-center sm:px-0 lg:justify-start lg:px-3
               group-data-[collapsed=true]/side:lg:justify-center group-data-[collapsed=true]/side:lg:px-0
               dark:bg-white/10 dark:hover:bg-white/15">
            <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5 shrink-0">
              <path
                d="M4 5.5A1.5 1.5 0 015.5 4h4A1.5 1.5 0 0111 5.5v4A1.5 1.5 0 019.5 11h-4A1.5 1.5 0 014 9.5v-4zm9 0A1.5 1.5 0 0114.5 4h4A1.5 1.5 0 0120 5.5v4A1.5 1.5 0 0118.5 11h-4A1.5 1.5 0 0113 9.5v-4zM4 14.5A1.5 1.5 0 015.5 13h4A1.5 1.5 0 0111 14.5v4A1.5 1.5 0 019.5 20h-4A1.5 1.5 0 014 18.5v-4zm9 0A1.5 1.5 0 0114.5 13h4a1.5 1.5 0 011.5 1.5v4a1.5 1.5 0 01-1.5 1.5h-4a1.5 1.5 0 01-1.5-1.5v-4z"
                stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="truncate sm:hidden lg:inline group-data-[collapsed=true]/side:lg:hidden">Dashboard</span>
            <span
              class="pointer-events-none absolute left-full z-20 ml-3 hidden whitespace-nowrap rounded-lg bg-ink-950 px-2.5 py-1.5 text-[12px] font-medium text-white opacity-0 shadow-lg transition-opacity group-hover:opacity-100 sm:block lg:hidden group-data-[collapsed=true]/side:lg:block">Dashboard</span>
          </a>

          <!-- INACTIVE row — duplicate this block, swap the <path d> + label -->
          <a href="#" class="group relative flex h-11 items-center gap-3 rounded-xl px-3 text-[13px] font-medium text-slate-500
               transition-colors hover:bg-slate-100 hover:text-slate-800 sm:justify-center sm:px-0 lg:justify-start lg:px-3
               group-data-[collapsed=true]/side:lg:justify-center group-data-[collapsed=true]/side:lg:px-0
               dark:text-slate-400 dark:hover:bg-white/5 dark:hover:text-white">
            <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5 shrink-0">
              <path d="M3 7.5L12 3l9 4.5v9L12 21l-9-4.5v-9zm0 0L12 12m9-4.5L12 12m0 0v9" stroke="currentColor"
                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="truncate sm:hidden lg:inline group-data-[collapsed=true]/side:lg:hidden">Products</span>
            <span
              class="pointer-events-none absolute left-full z-20 ml-3 hidden whitespace-nowrap rounded-lg bg-ink-950 px-2.5 py-1.5 text-[12px] font-medium text-white opacity-0 shadow-lg transition-opacity group-hover:opacity-100 sm:block lg:hidden group-data-[collapsed=true]/side:lg:block">Products</span>
          </a>
          <!-- + Calendar, Suppliers, Reports -->
        </nav>

        <div class="my-4 h-px shrink-0 bg-slate-200/70 dark:bg-white/10"></div>

        <!-- secondary nav: Notifications, Settings, Support — same row markup -->
        <nav class="flex flex-col gap-1"></nav>
      </div><!-- /scroll region -->

      <!-- promo block: hidden on the rail, never shrinks -->
      <div class="mb-4 mt-4 shrink-0 sm:hidden lg:block group-data-[collapsed=true]/side:lg:hidden">
        <div class="mb-3 grid h-24 place-items-center overflow-hidden rounded-xl bg-brand-50 dark:bg-white/5">
          <img src="./upgrade-illustration.svg" alt="" class="h-full w-full object-contain" />
        </div>
        <button
          class="w-full rounded-full bg-brand-600 px-4 py-2.5 text-[13px] font-semibold text-white transition-colors hover:bg-brand-700">
          Upgrade for Free
        </button>
      </div>

      <!-- user -->
      <div class="flex shrink-0 items-center gap-3 border-t border-slate-200/70 pt-4 sm:justify-center lg:justify-start
                group-data-[collapsed=true]/side:lg:justify-center dark:border-white/10">
        <img src="./avatar.jpg" alt="Johnathan"
          class="h-9 w-9 shrink-0 rounded-full object-cover ring-2 ring-brand-600/30" />
        <div class="min-w-0 flex-1 sm:hidden lg:block group-data-[collapsed=true]/side:lg:hidden">
          <div class="text-[11px] font-medium text-slate-500 dark:text-slate-400">Welcome back</div>
          <div class="truncate text-[13px] font-semibold text-slate-800 dark:text-white">Johnathan</div>
        </div>
        <svg viewBox="0 0 24 24" fill="none"
          class="h-4 w-4 shrink-0 text-slate-400 sm:hidden lg:block group-data-[collapsed=true]/side:lg:hidden">
          <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </div>
    </aside>

    <!-- ============ CONTENT ============ -->
    <main class="flex-1 overflow-y-auto">
      <header
        class="flex h-16 items-center gap-3 border-b border-slate-200/80 bg-white px-4 sm:hidden dark:border-white/5 dark:bg-ink-950">
        <button type="button" data-drawer-toggle
          class="grid h-10 w-10 place-items-center rounded-xl text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-white/5"
          aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" class="h-6 w-6">
            <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <span class="text-[15px] font-bold text-slate-900 dark:text-white">ABC Solutions</span>
      </header>

      <div class="p-6 sm:p-8">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Dashboard</h1>
        <!-- your content -->
      </div>
    </main>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const scrim = document.getElementById('scrim');

    document.querySelector('[data-drawer-toggle]')?.addEventListener('click', () => {
      sidebar.dataset.open = 'true';
      scrim.classList.remove('hidden');
    });
    scrim.addEventListener('click', () => {
      sidebar.dataset.open = 'false';
      scrim.classList.add('hidden');
    });
    document.querySelector('[data-collapse-toggle]')?.addEventListener('click', () => {
      const next = sidebar.dataset.collapsed !== 'true';
      sidebar.dataset.collapsed = String(next);
      localStorage.setItem('sidebar-collapsed', String(next));
    });
    if (localStorage.getItem('sidebar-collapsed') === 'true') sidebar.dataset.collapsed = 'true';

    // dark mode
    document.documentElement.classList.toggle('dark', localStorage.getItem('theme') === 'dark');
  </script>
</body>

</html>
